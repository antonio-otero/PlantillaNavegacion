<text x="45" y="451" text-anchor="start" font-size="12" font-family="DejaVu Sans, Verdana, sans-serif" fill="#0f2b46">Una acción del grafo lleva de Inicio a Detalle y Safe Args le pone tipo al dato: el texto viaja</text>
<text x="45" y="471" text-anchor="start" font-size="12" font-family="DejaVu Sans, Verdana, sans-serif" fill="#0f2b46">como mensaxe: String. Para volver, los tres caminos hacen lo mismo: navigateUp().</text>
