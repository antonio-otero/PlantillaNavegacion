  <text x="32" y="84" font-size="12" fill="#333">navigation = "2.10.2" (una sola vez)</text>

  <rect x="20" y="130" width="220" height="56" rx="6" fill="#EAF0F8" stroke="#1F3864"/>
  <text x="32" y="152" font-family="Consolas, monospace" font-size="13">build.gradle.kts (raíz)</text>
  <text x="32" y="172" font-size="12" fill="#333">declara: apply false</text>

  <rect x="20" y="218" width="220" height="76" rx="6" fill="#EAF0F8" stroke="#1F3864"/>
  <text x="32" y="240" font-family="Consolas, monospace" font-size="13">app/build.gradle.kts</text>
  <text x="32" y="260" font-size="12" fill="#333">aplica: android.application</text>
  <text x="32" y="278" font-size="12" fill="#333">… y safeargs.kotlin, la ÚLTIMA</text>

  <line x1="130" y1="98" x2="130" y2="128" stroke="#1F3864" stroke-width="2" marker-end="url(#f)"/>
  <line x1="130" y1="186" x2="130" y2="216" stroke="#1F3864" stroke-width="2" marker-end="url(#f)"/>

  <!-- Grafo -->
  <text x="290" y="28" font-size="16" font-weight="bold" fill="#1F3864">2 · Lo que escribes</text>
  <rect x="290" y="42" width="200" height="120" rx="6" fill="#FFF8E6" stroke="#B7791F"/>
  <text x="302" y="64" font-family="Consolas, monospace" font-size="13">res/navigation/</text>
  <text x="302" y="82" font-family="Consolas, monospace" font-size="13">nav_graph.xml</text>
  <text x="302" y="106" font-size="12" fill="#333">&lt;fragment&gt;  destinos</text>
  <text x="302" y="124" font-size="12" fill="#333">&lt;action&gt;    flechas</text>
  <text x="302" y="142" font-size="12" fill="#333">&lt;argument&gt;  datos</text>

  <!-- Generado -->
  <text x="540" y="28" font-size="16" font-weight="bold" fill="#1F3864">3 · Lo que genera Gradle</text>
  <rect x="540" y="42" width="200" height="56" rx="6" fill="#EEF7EE" stroke="#2F7D32"/>
  <text x="552" y="64" font-family="Consolas, monospace" font-size="12">InicioFragmentDirections</text>
  <text x="552" y="84" font-size="12" fill="#333">una función por &lt;action&gt;</text>
  <rect x="540" y="110" width="200" height="56" rx="6" fill="#EEF7EE" stroke="#2F7D32"/>
  <text x="552" y="132" font-family="Consolas, monospace" font-size="12">DetalleFragmentArgs</text>
  <text x="552" y="152" font-size="12" fill="#333">una propiedad por &lt;argument&gt;</text>

  <line x1="490" y1="80" x2="538" y2="70" stroke="#2F7D32" stroke-width="2" marker-end="url(#f)"/>
  <line x1="490" y1="124" x2="538" y2="138" stroke="#2F7D32" stroke-width="2" marker-end="url(#f)"/>
  <text x="494" y="58" font-size="11" fill="#2F7D32">Assemble</text>

  <!-- Safe Args lee el grafo -->
  <path d="M240,256 C300,256 330,210 390,164" fill="none" stroke="#1F3864" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="262" y="292" font-size="12" fill="#1F3864">Safe Args lee el grafo</text>

  <!-- Uso en fragmentos -->
  <text x="20" y="372" font-size="16" font-weight="bold" fill="#1F3864">4 · Lo que usas</text><text x="20" y="394" font-size="16" font-weight="bold" fill="#1F3864">en Kotlin →</text>
  <rect x="290" y="332" width="210" height="80" rx="6" fill="#F4F4F4" stroke="#555"/>
  <text x="302" y="354" font-family="Consolas, monospace" font-size="12">InicioFragment</text>
  <text x="302" y="376" font-family="Consolas, monospace" font-size="11">findNavController()</text>
  <text x="302" y="394" font-family="Consolas, monospace" font-size="11">  .navigate(accion)</text>
  <rect x="530" y="332" width="210" height="80" rx="6" fill="#F4F4F4" stroke="#555"/>
  <text x="542" y="354" font-family="Consolas, monospace" font-size="12">DetalleFragment</text>
  <text x="542" y="376" font-family="Consolas, monospace" font-size="11">val args: …Args</text>
  <text x="542" y="394" font-family="Consolas, monospace" font-size="11">  by navArgs()</text>

  <path d="M540,90 C512,96 515,250 400,330" fill="none" stroke="#2F7D32" stroke-width="2" marker-end="url(#f)"/>
  <line x1="640" y1="166" x2="640" y2="330" stroke="#2F7D32" stroke-width="2" marker-end="url(#f)"/>
